name: CDict Android

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Build and publish a signed release"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["Merge phrase dictionary"]
    types:
      - completed

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    name: Verify Android project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve lumen-crash SDK version
        run: python scripts/fetch-lumen-crash-sdk.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage compressed dictionary asset
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          base_url="https://github.com/Chloemlla/CDict/releases/download/dictionary-asset"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dict.db.br" "$base_url/dict.db.br"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dict.signature" "$base_url/dict.signature"
          curl -fL --retry 3 -o "$RUNNER_TEMP/checksums.txt" "$base_url/checksums.txt"
          (cd "$RUNNER_TEMP" && awk '$2 == "dict.db.br" || $2 == "dict.signature"' checksums.txt | sha256sum -c -)
          cp "$RUNNER_TEMP/dict.db.br" app/src/main/assets/dict.db.br
          cp "$RUNNER_TEMP/dict.signature" app/src/main/assets/dict.signature
          test -s app/src/main/assets/dict.db.br
          test -s app/src/main/assets/dict.signature
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdict-verification-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve lumen-crash SDK version
        run: python scripts/fetch-lumen-crash-sdk.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage compressed dictionary asset
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          base_url="https://github.com/Chloemlla/CDict/releases/download/dictionary-asset"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dict.db.br" "$base_url/dict.db.br"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dict.signature" "$base_url/dict.signature"
          curl -fL --retry 3 -o "$RUNNER_TEMP/checksums.txt" "$base_url/checksums.txt"
          (cd "$RUNNER_TEMP" && awk '$2 == "dict.db.br" || $2 == "dict.signature"' checksums.txt | sha256sum -c -)
          cp "$RUNNER_TEMP/dict.db.br" app/src/main/assets/dict.db.br
          cp "$RUNNER_TEMP/dict.signature" app/src/main/assets/dict.signature
          test -s app/src/main/assets/dict.db.br
          test -s app/src/main/assets/dict.signature
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate signing secrets and keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing required repository secret: $name"; exit 1; fi
          done
          keytool_path="$RUNNER_TEMP/cdict-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keytool_path"
          test -s "$keytool_path" || { echo "::error::Decoded keystore is empty"; exit 1; }
          chmod 600 "$keytool_path"
          keytool -list -keystore "$keytool_path" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>"$RUNNER_TEMP/keytool-error" || { echo "::error::Keystore alias/password validation failed"; rm -f "$RUNNER_TEMP/keytool-error"; exit 1; }
          rm -f "$RUNNER_TEMP/keytool-error"
      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "CDICT_COMMIT_HASH=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "CDICT_BUILD_TIME=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build debug APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/cdict-release.jks
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: cdict-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Build signed release
    permissions:
      contents: write
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: verify
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Read release version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$version_name" ]; then
            echo "::error::Unable to read versionName from app/build.gradle.kts"
            exit 1
          fi
          short_hash="${GITHUB_SHA::8}"
          if [ -z "$short_hash" ]; then
            echo "::error::GITHUB_SHA is empty; cannot name the release"
            exit 1
          fi
          echo "CDICT_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "CDICT_SHORT_HASH=$short_hash" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve lumen-crash SDK version
        run: python scripts/fetch-lumen-crash-sdk.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage compressed dictionary asset
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          base_url="https://github.com/Chloemlla/CDict/releases/download/dictionary-asset"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dict.db.br" "$base_url/dict.db.br"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dict.signature" "$base_url/dict.signature"
          curl -fL --retry 3 -o "$RUNNER_TEMP/checksums.txt" "$base_url/checksums.txt"
          (cd "$RUNNER_TEMP" && awk '$2 == "dict.db.br" || $2 == "dict.signature"' checksums.txt | sha256sum -c -)
          cp "$RUNNER_TEMP/dict.db.br" app/src/main/assets/dict.db.br
          cp "$RUNNER_TEMP/dict.signature" app/src/main/assets/dict.signature
          test -s app/src/main/assets/dict.db.br
          test -s app/src/main/assets/dict.signature
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate signing secrets and keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing required repository secret: $name"; exit 1; fi
          done
          keytool_path="$RUNNER_TEMP/cdict-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keytool_path"
          test -s "$keytool_path" || { echo "::error::Decoded keystore is empty"; exit 1; }
          chmod 600 "$keytool_path"
          keytool -list -keystore "$keytool_path" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>"$RUNNER_TEMP/keytool-error" || { echo "::error::Keystore alias/password validation failed"; rm -f "$RUNNER_TEMP/keytool-error"; exit 1; }
          rm -f "$RUNNER_TEMP/keytool-error"
      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "CDICT_COMMIT_HASH=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "CDICT_BUILD_TIME=$(date +%s)" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/cdict-release.jks
        run: >-
          ./gradlew :app:assembleRelease
          -PCDICT_COMMIT_HASH="${{ env.CDICT_COMMIT_HASH }}"
          -PCDICT_BUILD_TIME="${{ env.CDICT_BUILD_TIME }}"
          --no-daemon --stacktrace
      - name: Locate Android SDK apksigner
        id: locate-apksigner
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/build-tools" ]; then
            echo "::error::Android SDK build-tools directory was not found"
            exit 1
          fi
          apksigner_path="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -perm -u+x -print | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "::error::No executable apksigner was found in Android SDK build-tools"
            exit 1
          fi
          apksigner_path="$(realpath -- "$apksigner_path")"
          test -x "$apksigner_path"
          "$apksigner_path" version >/dev/null
          printf 'path=%s\n' "$apksigner_path" >> "$GITHUB_OUTPUT"
      - name: Verify APK signatures
        env:
          APKSIGNER_PATH: ${{ steps.locate-apksigner.outputs.path }}
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            "$APKSIGNER_PATH" verify --verbose --print-certs "$apk"
          done
      - name: Verify APKs with jarsigner
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            jarsigner -verify -verbose -certs "$apk"
          done
      - name: Prepare and upload release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-assets/CDict-arm64-v8a.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk release-assets/CDict-armeabi-v7a.apk
          cp app/build/outputs/apk/release/app-x86-release.apk release-assets/CDict-x86.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk release-assets/CDict-x86_64.apk
          cp app/build/outputs/apk/release/app-universal-release.apk release-assets/CDict.apk
          cp app/src/main/assets/dict.db.br release-assets/CDict-dict.db.br
          cp app/src/main/assets/dict.signature release-assets/dict.signature
          (cd release-assets && sha256sum CDict.apk CDict-arm64-v8a.apk CDict-armeabi-v7a.apk CDict-x86.apk CDict-x86_64.apk CDict-dict.db.br dict.signature > checksums.txt)
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cdict-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "v${{ env.CDICT_VERSION_NAME }}-${{ env.CDICT_SHORT_HASH }}"
          name: "CDict ${{ env.CDICT_VERSION_NAME }}-${{ env.CDICT_SHORT_HASH }}"
          draft: false
          make_latest: true
          generate_release_notes: true
          files: release-assets/*
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/cdict-release.jks" "$RUNNER_TEMP/keytool-error"
