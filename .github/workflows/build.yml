name: CDict Android

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Build and publish a signed release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  # Expected bytes of the bundled dictionary. The digests live here, in version control,
  # because `dictionary-asset` is a mutable tag that the merge workflows overwrite with
  # --clobber: a checksums.txt shipped inside that same release can only catch a truncated
  # download. Publishing a new dictionary therefore ends with a commit updating these two
  # lines, which is also what makes an APK reproducible from its commit.
  DICT_DB_BR_SHA256: "6815346622ce3cb5eb414276094f7ad54dd0095038f7431d05df2a5b007f166e"
  DICT_SIGNATURE_SHA256: "b2f66132f3e6032302d6d5c165383fce6e17aadce302bf09498e107512bfc2eb"

jobs:
  verify:
    name: Verify Android project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve lumen-crash SDK version
        run: python scripts/fetch-lumen-crash-sdk.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage compressed dictionary asset
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          base_url="https://github.com/Chloemlla/CDict/releases/download/dictionary-asset"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dict.db.br" "$base_url/dict.db.br"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dict.signature" "$base_url/dict.signature"
          {
            printf '%s  dict.db.br\n' "$DICT_DB_BR_SHA256"
            printf '%s  dict.signature\n' "$DICT_SIGNATURE_SHA256"
          } > "$RUNNER_TEMP/expected-dictionary.sha256"
          if ! (cd "$RUNNER_TEMP" && sha256sum -c expected-dictionary.sha256); then
            echo "::error::dictionary-asset does not match the digests pinned in .github/workflows/build.yml. If the dictionary was republished on purpose, update DICT_DB_BR_SHA256 / DICT_SIGNATURE_SHA256 with the values printed by the merge workflow."
            exit 1
          fi
          cp "$RUNNER_TEMP/dict.db.br" app/src/main/assets/dict.db.br
          cp "$RUNNER_TEMP/dict.signature" app/src/main/assets/dict.signature
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
      # lintDebug does not run the release-only checks (the fatal-severity rules that
      # depend on minify/shrink), and the release APK is published automatically, so the
      # release variant needs its own gate. This step needs no signing material.
      - name: Run release lint checks
        run: ./gradlew :app:lintVitalRelease --no-daemon --stacktrace
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdict-verification-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.*
            app/build/reports/lint-vital-*.*
          if-no-files-found: ignore
          retention-days: 14

  debug:
    name: Build debug APK
    # No signing material and no app secret in this job: a debug variant is debuggable,
    # so anything handed to it can be read out of the artifact. Restricted to main /
    # manual runs so a push to any branch cannot spend a release-privileged runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve lumen-crash SDK version
        run: python scripts/fetch-lumen-crash-sdk.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage compressed dictionary asset
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          base_url="https://github.com/Chloemlla/CDict/releases/download/dictionary-asset"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dict.db.br" "$base_url/dict.db.br"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dict.signature" "$base_url/dict.signature"
          {
            printf '%s  dict.db.br\n' "$DICT_DB_BR_SHA256"
            printf '%s  dict.signature\n' "$DICT_SIGNATURE_SHA256"
          } > "$RUNNER_TEMP/expected-dictionary.sha256"
          if ! (cd "$RUNNER_TEMP" && sha256sum -c expected-dictionary.sha256); then
            echo "::error::dictionary-asset does not match the digests pinned in .github/workflows/build.yml. If the dictionary was republished on purpose, update DICT_DB_BR_SHA256 / DICT_SIGNATURE_SHA256 with the values printed by the merge workflow."
            exit 1
          fi
          cp "$RUNNER_TEMP/dict.db.br" app/src/main/assets/dict.db.br
          cp "$RUNNER_TEMP/dict.signature" app/src/main/assets/dict.signature
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "CDICT_COMMIT_HASH=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "CDICT_BUILD_TIME=$(date +%s)" >> "$GITHUB_ENV"
          echo "CDICT_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "CDICT_SHORT_HASH=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "CDICT_BUILD_TIME_UTC_MILLIS=$(date -u +%s)000" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdict-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Build signed release
    permissions:
      contents: write
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    needs: verify
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      CDICT_APP_SIGN_SECRET: ${{ secrets.CDICT_APP_SIGN_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Read release version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$version_name" ]; then
            echo "::error::Unable to read versionName from app/build.gradle.kts"
            exit 1
          fi
          short_hash="${GITHUB_SHA::8}"
          if [ -z "$short_hash" ]; then
            echo "::error::GITHUB_SHA is empty; cannot name the release"
            exit 1
          fi
          echo "CDICT_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "CDICT_SHORT_HASH=$short_hash" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve lumen-crash SDK version
        run: python scripts/fetch-lumen-crash-sdk.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage compressed dictionary asset
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          base_url="https://github.com/Chloemlla/CDict/releases/download/dictionary-asset"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dict.db.br" "$base_url/dict.db.br"
          curl -fL --retry 3 -o "$RUNNER_TEMP/dict.signature" "$base_url/dict.signature"
          {
            printf '%s  dict.db.br\n' "$DICT_DB_BR_SHA256"
            printf '%s  dict.signature\n' "$DICT_SIGNATURE_SHA256"
          } > "$RUNNER_TEMP/expected-dictionary.sha256"
          if ! (cd "$RUNNER_TEMP" && sha256sum -c expected-dictionary.sha256); then
            echo "::error::dictionary-asset does not match the digests pinned in .github/workflows/build.yml. If the dictionary was republished on purpose, update DICT_DB_BR_SHA256 / DICT_SIGNATURE_SHA256 with the values printed by the merge workflow."
            exit 1
          fi
          cp "$RUNNER_TEMP/dict.db.br" app/src/main/assets/dict.db.br
          cp "$RUNNER_TEMP/dict.signature" app/src/main/assets/dict.signature
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Validate signing secrets and keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing required repository secret: $name"; exit 1; fi
          done
          keytool_path="$RUNNER_TEMP/cdict-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keytool_path"
          test -s "$keytool_path" || { echo "::error::Decoded keystore is empty"; exit 1; }
          chmod 600 "$keytool_path"
          keytool -list -keystore "$keytool_path" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>"$RUNNER_TEMP/keytool-error" || { echo "::error::Keystore alias/password validation failed"; rm -f "$RUNNER_TEMP/keytool-error"; exit 1; }
          rm -f "$RUNNER_TEMP/keytool-error"
      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "CDICT_COMMIT_HASH=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "CDICT_BUILD_TIME=$(date +%s)" >> "$GITHUB_ENV"
          echo "CDICT_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "CDICT_SHORT_HASH=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "CDICT_BUILD_TIME_UTC_MILLIS=$(date -u +%s)000" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/cdict-release.jks
        run: >-
          ./gradlew :app:assembleRelease
          -PCDICT_COMMIT_HASH="${{ env.CDICT_COMMIT_HASH }}"
          -PCDICT_BUILD_TIME="${{ env.CDICT_BUILD_TIME }}"
          -PCDICT_SHORT_HASH="${{ env.CDICT_SHORT_HASH }}"
          -PCDICT_BUILD_TIME_UTC_MILLIS="${{ env.CDICT_BUILD_TIME_UTC_MILLIS }}"
          --no-daemon --stacktrace
      - name: Locate Android SDK apksigner
        id: locate-apksigner
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/build-tools" ]; then
            echo "::error::Android SDK build-tools directory was not found"
            exit 1
          fi
          apksigner_path="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -perm -u+x -print | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "::error::No executable apksigner was found in Android SDK build-tools"
            exit 1
          fi
          apksigner_path="$(realpath -- "$apksigner_path")"
          test -x "$apksigner_path"
          "$apksigner_path" version >/dev/null
          printf 'path=%s\n' "$apksigner_path" >> "$GITHUB_OUTPUT"
      - name: Verify APK signatures
        env:
          APKSIGNER_PATH: ${{ steps.locate-apksigner.outputs.path }}
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            "$APKSIGNER_PATH" verify --verbose --print-certs "$apk"
          done
      - name: Verify APKs with jarsigner
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            jarsigner -verify -verbose -certs "$apk"
          done
      - name: Prepare and upload release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          base="CDict_android_${CDICT_VERSION_NAME}-${CDICT_SHORT_HASH}"
          cp app/build/outputs/apk/release/app-universal-release.apk "release-assets/${base}.apk"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "release-assets/${base}_${abi}.apk"
          done
          cp app/src/main/assets/dict.db.br release-assets/CDict-dict.db.br
          cp app/src/main/assets/dict.signature release-assets/dict.signature
          (cd release-assets && sha256sum *.apk CDict-dict.db.br dict.signature > checksums.txt)
          cat release-assets/checksums.txt
      - name: Write release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["CDICT_VERSION_NAME"]
          short = os.environ["CDICT_SHORT_HASH"]
          base = f"CDict_android_{version}-{short}"
          names = {f"{base}.apk": "universal"}
          for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64"):
              names[f"{base}_{abi}.apk"] = abi

          def digest(path):
              sha = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      sha.update(chunk)
              return sha.hexdigest()

          out = Path("release-assets")
          assets = [
              {
                  "name": name,
                  "abi": abi,
                  "sizeBytes": (out / name).stat().st_size,
                  "sha256": digest(out / name),
              }
              for name, abi in names.items()
          ]
          manifest = {
              "application": "CDict",
              "platform": "android",
              "tag": f"v{version}-{short}",
              "versionName": version,
              "versionCode": int(os.environ["CDICT_VERSION_CODE"]),
              "commit": os.environ["CDICT_COMMIT_HASH"],
              "shortCommit": short,
              "buildTimeUtcMillis": int(os.environ["CDICT_BUILD_TIME_UTC_MILLIS"]),
              "assets": assets,
          }
          (out / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          cat release-assets/release-manifest.json
      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdict-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
      # R8 removes members that are only reached reflectively; without these files a
      # "works in debug, crashes in release" report cannot be traced to the rule that
      # dropped the target.
      - name: Upload R8 mapping and usage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdict-release-r8-reports
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn
          retention-days: 90
      - name: Publish GitHub release
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v${CDICT_VERSION_NAME}-${CDICT_SHORT_HASH}"
          body="$(printf '## CDict %s-%s\n\nRelease for commit %s.' \
            "${CDICT_VERSION_NAME}" "${CDICT_SHORT_HASH}" "${GITHUB_SHA}")"
          if gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${GITHUB_REPOSITORY}/releases \
            -f tag_name="${tag}" \
            -f name="CDict ${CDICT_VERSION_NAME}-${CDICT_SHORT_HASH}" \
            -F body="${body}" \
            -f target_commitish="${GITHUB_SHA}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            --jq '.id' >/dev/null; then
            echo "Created release ${tag}"
          elif gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skipping creation"
          else
            echo "::error::Failed to create release ${tag}"
            exit 1
          fi
          gh release upload "${tag}" release-assets/* --clobber
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/cdict-release.jks" "$RUNNER_TEMP/keytool-error"
