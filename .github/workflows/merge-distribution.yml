name: Merge distribution dictionary

on:
  workflow_dispatch:
    inputs:
      distribution_url:
        description: "URL of the distribution.sqlite source (plain or .gz)"
        required: false
        default: "https://github.com/ahpxex/open-dictionary/releases/download/v2.0/distribution.sqlite.gz"
      curriculum_url:
        description: "URL of the curriculum word list (3500.txt)"
        required: false
        default: "https://raw.githubusercontent.com/pluto0x0/word3500/refs/heads/master/3500.txt"
      curriculum_tag:
        description: "Label applied to headwords present in the curriculum list"
        required: false
        default: "高中 3500 词"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  merge:
    name: Merge distribution.sqlite into CDict-dict.db
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and decompress distribution source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/distribution.sqlite.gz" "${{ inputs.distribution_url }}"
          python - "$RUNNER_TEMP/distribution.sqlite.gz" "$RUNNER_TEMP/distribution.sqlite" <<'PY'
          import gzip
          import pathlib
          import sys
          src = pathlib.Path(sys.argv[1])
          dst = pathlib.Path(sys.argv[2])
          raw = src.read_bytes()
          if raw[:2] == b"\x1f\x8b":
              dst.write_bytes(gzip.decompress(raw))
          else:
              dst.write_bytes(raw)
          PY
          test -s "$RUNNER_TEMP/distribution.sqlite"
          echo "source bytes: $(stat -c %s "$RUNNER_TEMP/distribution.sqlite")"

      - name: Merge rich content into dictionary asset
        run: |
          set -euo pipefail
          python scripts/merge_distribution.py \
            scripts/CDict-dict.db \
            "$RUNNER_TEMP/distribution.sqlite" \
            "$RUNNER_TEMP/CDict-dict-merged.db" \
            --expected-word-count 49213 \
            --expected-groups 7

      - name: Apply curriculum tags to merged asset
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/curriculum.txt" "${{ inputs.curriculum_url }}"
          test -s "$RUNNER_TEMP/curriculum.txt"
          python scripts/apply_curriculum_tags.py \
            "$RUNNER_TEMP/CDict-dict-merged.db" \
            "$RUNNER_TEMP/curriculum.txt" \
            --tag "${{ inputs.curriculum_tag }}" \
            --source "${{ inputs.curriculum_url }}"

      - name: Verify merged dictionary asset integrity
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/CDict-dict-merged.db"
          python scripts/validate_dictionary_asset.py \
            "$RUNNER_TEMP/CDict-dict-merged.db"

      - name: Extract dictionary signature
        run: |
          python - "$RUNNER_TEMP/CDict-dict-merged.db" "$RUNNER_TEMP/dict.signature" <<'PY'
          import sqlite3, sys
          con = sqlite3.connect(sys.argv[1])
          sig = con.execute("SELECT value FROM metadata WHERE key='assetSignature'").fetchone()
          if not sig:
              raise SystemExit("error: missing assetSignature in merged db")
          open(sys.argv[2], "w").write(sig[0] + "\n")
          PY

      - name: Rename and checksum release assets
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/CDict-dict-merged.db" "$RUNNER_TEMP/CDict-dict.db"
          (cd "$RUNNER_TEMP" && sha256sum CDict-dict.db dict.signature > checksums.txt && cat checksums.txt)

      - name: Publish dictionary release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view dictionary-asset --json id >/dev/null 2>&1 || \
            gh release create dictionary-asset \
              --title "CDict dictionary asset" \
              --notes "Merged dictionary database (distribution enrichment). Published automatically by merge-distribution workflow."
          gh release upload dictionary-asset \
            "$RUNNER_TEMP/CDict-dict.db" \
            "$RUNNER_TEMP/dict.signature" \
            "$RUNNER_TEMP/checksums.txt" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload merged dictionary artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDict-dict-merged
          path: ${{ runner.temp }}/CDict-dict-merged.db
          if-no-files-found: error
          retention-days: 30
