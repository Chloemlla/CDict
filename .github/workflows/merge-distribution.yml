name: Merge distribution dictionary

on:
  workflow_dispatch:
    inputs:
      distribution_url:
        description: "URL of the distribution.sqlite source (plain or .gz)"
        required: false
        default: "https://github.com/ahpxex/open-dictionary/releases/download/v2.0/distribution.sqlite.gz"
      curriculum_url:
        description: "URL of the curriculum word list (3500.txt)"
        required: false
        default: "https://raw.githubusercontent.com/pluto0x0/word3500/refs/heads/master/3500.txt"
      curriculum_tag:
        description: "Label applied to headwords present in the curriculum list"
        required: false
        default: "高中 3500 词"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  merge:
    name: Merge distribution.sqlite into CDict-dict.db
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Baseline is the published asset, not the git copy: the git copy is not updated by
      # the merge workflows, so starting from it would drop everything the other merge
      # workflow has already added to dictionary-asset.
      - name: Download current dictionary asset
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/Chloemlla/CDict/releases/download/dictionary-asset"
          curl -fL --retry 3 -o "$RUNNER_TEMP/CDict-dict-base.db" "$base_url/CDict-dict.db"
          test -s "$RUNNER_TEMP/CDict-dict-base.db"

      - name: Download and decompress distribution source
        shell: bash
        env:
          DISTRIBUTION_URL: ${{ inputs.distribution_url }}
        run: |
          set -euo pipefail
          case "$DISTRIBUTION_URL" in
            https://*) ;;
            *) echo "::error::distribution_url must be an https:// URL"; exit 1 ;;
          esac
          curl -fL --retry 3 -o "$RUNNER_TEMP/distribution.sqlite.gz" "$DISTRIBUTION_URL"
          python - "$RUNNER_TEMP/distribution.sqlite.gz" "$RUNNER_TEMP/distribution.sqlite" <<'PY'
          import gzip
          import pathlib
          import sys
          src = pathlib.Path(sys.argv[1])
          dst = pathlib.Path(sys.argv[2])
          raw = src.read_bytes()
          if raw[:2] == b"\x1f\x8b":
              dst.write_bytes(gzip.decompress(raw))
          else:
              dst.write_bytes(raw)
          PY
          test -s "$RUNNER_TEMP/distribution.sqlite"
          echo "source bytes: $(stat -c %s "$RUNNER_TEMP/distribution.sqlite")"

      - name: Merge rich content into dictionary asset
        run: |
          set -euo pipefail
          python scripts/merge_distribution.py \
            "$RUNNER_TEMP/CDict-dict-base.db" \
            "$RUNNER_TEMP/distribution.sqlite" \
            "$RUNNER_TEMP/CDict-dict-merged.db" \
            --expected-groups 7

      - name: Apply curriculum tags to merged asset
        shell: bash
        env:
          CURRICULUM_URL: ${{ inputs.curriculum_url }}
          CURRICULUM_TAG: ${{ inputs.curriculum_tag }}
        run: |
          set -euo pipefail
          case "$CURRICULUM_URL" in
            https://*) ;;
            *) echo "::error::curriculum_url must be an https:// URL"; exit 1 ;;
          esac
          curl -fL --retry 3 -o "$RUNNER_TEMP/curriculum.txt" "$CURRICULUM_URL"
          test -s "$RUNNER_TEMP/curriculum.txt"
          python scripts/apply_curriculum_tags.py \
            "$RUNNER_TEMP/CDict-dict-merged.db" \
            "$RUNNER_TEMP/curriculum.txt" \
            --tag "$CURRICULUM_TAG" \
            --source "$CURRICULUM_URL"

      - name: Verify merged dictionary asset integrity
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/CDict-dict-merged.db"
          python scripts/validate_dictionary_asset.py \
            "$RUNNER_TEMP/CDict-dict-merged.db"

      - name: Extract dictionary signature
        run: |
          python - "$RUNNER_TEMP/CDict-dict-merged.db" "$RUNNER_TEMP/dict.signature" <<'PY'
          import sqlite3, sys
          con = sqlite3.connect(sys.argv[1])
          sig = con.execute("SELECT value FROM metadata WHERE key='assetSignature'").fetchone()
          if not sig:
              raise SystemExit("error: missing assetSignature in merged db")
          open(sys.argv[2], "w").write(sig[0] + "\n")
          PY

      - name: Compress dictionary asset with Brotli
        run: |
          set -euo pipefail
          pip install brotli
          python -c "import brotli; open('$RUNNER_TEMP/dict.db.br','wb').write(brotli.compress(open('$RUNNER_TEMP/CDict-dict-merged.db','rb').read(), quality=11))"
          test -s "$RUNNER_TEMP/dict.db.br"

      - name: Rename and checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/CDict-dict-merged.db" "$RUNNER_TEMP/CDict-dict.db"
          (cd "$RUNNER_TEMP" && sha256sum CDict-dict.db dict.db.br dict.signature > checksums.txt && cat checksums.txt)
          # The app build checks the downloaded dictionary against digests committed in
          # build.yml, so republishing the asset needs a follow-up commit there.
          {
            echo "### Update .github/workflows/build.yml before the next app build"
            echo '```yaml'
            echo "  DICT_DB_BR_SHA256: \"$(sha256sum "$RUNNER_TEMP/dict.db.br" | cut -d' ' -f1)\""
            echo "  DICT_SIGNATURE_SHA256: \"$(sha256sum "$RUNNER_TEMP/dict.signature" | cut -d' ' -f1)\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish dictionary release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view dictionary-asset --json id >/dev/null 2>&1 || \
            gh release create dictionary-asset \
              --title "CDict dictionary asset" \
              --notes "Merged dictionary database (distribution enrichment). Published automatically by merge-distribution workflow."
          gh release upload dictionary-asset \
            "$RUNNER_TEMP/CDict-dict.db" \
            "$RUNNER_TEMP/dict.db.br" \
            "$RUNNER_TEMP/dict.signature" \
            "$RUNNER_TEMP/checksums.txt" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload merged dictionary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CDict-dict-merged
          path: ${{ runner.temp }}/CDict-dict-merged.db
          if-no-files-found: error
          retention-days: 30
