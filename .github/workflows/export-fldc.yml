name: Export FLDC dictionary

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  export:
    name: Export FLDC dictionary asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode FLDC binary payload to JSON
        run: |
          set -euo pipefail
          python scripts/fetch_fldc_export.py --output "$RUNNER_TEMP/fldc.json"

      - name: Convert JSON to SQLite dictionary asset
        run: |
          set -euo pipefail
          python scripts/convert_dictionary.py \
            "$RUNNER_TEMP/fldc.json" \
            "$RUNNER_TEMP/FLDC-dict.db" \
            --expected-word-count 107143 \
            --expected-groups 7

      - name: Verify dictionary asset integrity
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/FLDC-dict.db"
          python3 -c "
import sqlite3, sys
db = sqlite3.connect('$RUNNER_TEMP/FLDC-dict.db')
tables = {row[0] for row in db.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")}
print('Tables:', sorted(tables))
for t in ('words', 'groups', 'metadata', 'word_search'):
    assert t in tables, f'Missing table: {t}'
cnt = db.execute('SELECT COUNT(*) FROM words').fetchone()[0]
print(f'Words: {cnt}')
assert cnt == 107143, f'Expected 107143 words, got {cnt}'
grp = db.execute('SELECT COUNT(*) FROM groups').fetchone()[0]
print(f'Groups: {grp}')
assert grp == 7, f'Expected 7 groups, got {grp}'
db.close()
print('All checks passed')
"

      - name: Upload FLDC dictionary asset
        uses: actions/upload-artifact@v4
        with:
          name: FLDC-dict-db
          path: ${{ runner.temp }}/FLDC-dict.db
          if-no-files-found: error
          retention-days: 90