name: Export FLDC dictionary

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  export:
    name: Export FLDC dictionary asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Decode FLDC binary payload to JSON
        run: |
          set -euo pipefail
          python scripts/fetch_fldc_export.py --output "$RUNNER_TEMP/fldc.json"

      - name: Convert JSON to SQLite dictionary asset
        run: |
          set -euo pipefail
          python scripts/convert_dictionary.py \
            "$RUNNER_TEMP/fldc.json" \
            "$RUNNER_TEMP/FLDC-dict.db" \
            --expected-word-count 107143 \
            --expected-groups 7

      - name: Verify dictionary asset integrity
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/FLDC-dict.db"
          python scripts/validate_dictionary_asset.py \
            "$RUNNER_TEMP/FLDC-dict.db" \
            --expected-word-count 107143 \
            --expected-groups 7

      - name: Upload FLDC dictionary asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FLDC-dict-db
          path: ${{ runner.temp }}/FLDC-dict.db
          if-no-files-found: error
          retention-days: 90