name: Publish dictionary asset

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  publish:
    name: Rebuild and publish dictionary release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Input is the published asset, not the git copy: the merge workflows only update the
      # release, so the git copy lags behind and republishing it would undo their merges.
      - name: Download current dictionary asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pub"
          base_url="https://github.com/Chloemlla/CDict/releases/download/dictionary-asset"
          curl -fL --retry 3 -o "$RUNNER_TEMP/pub/CDict-dict.db" "$base_url/CDict-dict.db"
          test -s "$RUNNER_TEMP/pub/CDict-dict.db"

      - name: Recompute assetSignature in place
        shell: bash
        run: |
          set -euo pipefail
          python scripts/recompute_asset_signature.py "$RUNNER_TEMP/pub/CDict-dict.db"

      - name: Sync the git copy of the dictionary
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/pub/CDict-dict.db" scripts/CDict-dict.db
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/CDict-dict.db
          if git diff --cached --quiet; then
            echo "No changes to commit (the git copy already matches the published asset)."
          else
            git commit -m "chore(dictionary): sync dictionary asset and recompute assetSignature"
            git push
          fi

      - name: Extract dictionary signature
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/pub/CDict-dict.db" "$RUNNER_TEMP/pub/dict.signature" <<'PY'
          import sqlite3, sys
          con = sqlite3.connect(sys.argv[1])
          sig = con.execute("SELECT value FROM metadata WHERE key='assetSignature'").fetchone()
          if not sig:
              raise SystemExit("error: missing assetSignature in dictionary db")
          open(sys.argv[2], "w").write(sig[0] + "\n")
          PY
          test -s "$RUNNER_TEMP/pub/dict.signature"

      - name: Compress dictionary asset with Brotli
        run: |
          set -euo pipefail
          pip install brotli
          python -c "import brotli; open('$RUNNER_TEMP/pub/dict.db.br','wb').write(brotli.compress(open('$RUNNER_TEMP/pub/CDict-dict.db','rb').read(), quality=11))"
          test -s "$RUNNER_TEMP/pub/dict.db.br"

      - name: Checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/pub" && sha256sum CDict-dict.db dict.db.br dict.signature > checksums.txt && cat checksums.txt)
          # The app build checks the downloaded dictionary against digests committed in
          # build.yml, so republishing the asset needs a follow-up commit there.
          {
            echo "### Update .github/workflows/build.yml before the next app build"
            echo '```yaml'
            echo "  DICT_DB_BR_SHA256: \"$(sha256sum "$RUNNER_TEMP/pub/dict.db.br" | cut -d' ' -f1)\""
            echo "  DICT_SIGNATURE_SHA256: \"$(sha256sum "$RUNNER_TEMP/pub/dict.signature" | cut -d' ' -f1)\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish dictionary release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view dictionary-asset --json id >/dev/null 2>&1 || \
            gh release create dictionary-asset \
              --title "CDict dictionary asset" \
              --notes "Merged dictionary database (distribution enrichment). Published automatically." \
              --repo "$GITHUB_REPOSITORY"
          gh release upload dictionary-asset \
            "$RUNNER_TEMP/pub/CDict-dict.db" \
            "$RUNNER_TEMP/pub/dict.db.br" \
            "$RUNNER_TEMP/pub/dict.signature" \
            "$RUNNER_TEMP/pub/checksums.txt" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"